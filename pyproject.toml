[project]
name = "portfolio-lens"
version = "0.1.0"
description = "Vamshi's Portfolio Lens: a local, multi-broker investment dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.11,<5",
    "openai>=2,<3",
    "pandas>=2.2,<4",
    "plotly>=6,<7",
    "python-dotenv>=1,<2",
    "reportlab>=4,<5",
    "streamlit>=1.65,<2",
    "yfinance>=0.2.65,<2",
]

[dependency-groups]
dev = [
    "pypdf>=5,<7",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
